<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeTime - Riconnessione</title>
<style>
  html,body{height:100%;margin:0;background:#070b18;color:#f7f8fc;font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;text-align:center}
  .box{padding:40px}
  .logo{width:88px;height:88px;margin:0 auto 20px;border-radius:24px;background:linear-gradient(135deg,#9b6cff,#3d218d);display:grid;place-items:center;font-size:38px;font-weight:900}
  h1{font-size:24px;margin:0 0 10px}
  p{color:#91a0ba;max-width:340px;margin:0 auto 24px;line-height:1.5}
  button{min-height:52px;padding:0 28px;border:0;border-radius:16px;background:#8055ff;color:white;font-weight:800;font-size:15px;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">F</div>
    <h1>In attesa del server locale...</h1>
    <p>FreeTime deve essere avviato sul dispositivo (python app.py). Se lo hai gia avviato, riprova tra qualche secondo.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
