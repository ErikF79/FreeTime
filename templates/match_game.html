{% extends "flow_base.html" %}{% set current=3 %}{% set back_url=url_for('match_participants') %}{% block title %}FreeTime | Gioco{% endblock %}{% block flow %}<section class="flow-title"><span class="kicker">CATALOGO</span><h1>Scegli un gioco</h1><p>Seleziona il titolo della sfida.</p></section><form method="post"><div class="game-select-rail">{% for game in games %}<label class="game-cover cover-{{ loop.index }}"><input type="radio" name="game_id" value="{{ game.game_id }}"><span class="cover-symbol">{{ game.icon }}</span><span class="cover-copy"><b>{{ game.category }}</b><strong>{{ game.name }}</strong><small>{{ game.description }}</small></span><i>✓</i></label>{% endfor %}</div><div class="action-bar"><a href="{{ back_url }}">Indietro</a><button>Continua <span>→</span></button></div></form>{% endblock %}
